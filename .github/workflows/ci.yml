name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck, Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate route types
        # LayoutProps/PageProps are ambient types Next.js writes to
        # .next/types/ (normally a side effect of `next dev`/`next build`).
        # A fresh CI checkout has neither, so `tsc --noEmit` fails on them
        # without this explicit step.
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    # Needs live Sanity/Clerk/Stripe credentials as repo secrets (see
    # README.md's CI section) to actually pass. Soft-fail rather than
    # redden the whole pipeline for repos that haven't configured them.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run e2e
        env:
          CI: true
          # Every route renders through ClerkProvider, so the app needs a
          # real (test-mode) Clerk instance to boot -- a fake/placeholder
          # key fails Clerk's live host validation, not just a format check.
          # Configure a free Clerk test app's keys as repo secrets; see
          # README.md's CI section.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          # The e2e specs seed/read fixtures directly against a real Sanity
          # dataset and drive a real Stripe test-mode payment, so the app
          # (built via playwright's webServer) and the specs themselves
          # both need these to be live values, not placeholders.
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.SANITY_API_VERSION }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
